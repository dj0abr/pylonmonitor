<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pylontech Monitor</title>
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column; /* Ensures vertical stacking */
        height: 100vh;
    }

    .form-container {
        width: 100%;
        max-width: 400px; /* Matches form width for alignment */
        text-align: center; /* Centers the title */
    }

    h1 {
        color: #333;
        margin-bottom: 20px; /* Adds space between the title and the form */
    }

    h2 {
        color: #0a30ad;
        margin-bottom: 20px; /* Adds space between the title and the form */
    }

    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
        font-weight: bold;
        color: #555;
    }

    input[type="text"],
    input[type="password"] {
        width: calc(100% - 22px);
        padding: 10px;
        margin: 8px 0 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 18px; /* Increased font size for better readability */
    }


    input[type="submit"] {
        background-color: #007BFF;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
    }

    input[type="submit"]:hover {
        background-color: #0056b3;
    }

    #confirmationMessage {
        display: none;
        font-size: 20px;
        font-weight: bold;
        color: #28a745;
        margin: 20px 0;
        text-align: center;
    }

    .copyright {
        color: grey; /* Sets the color to grey */
        font-size: 12px; /* Sets a small font size */
        text-align: center; /* Centers the text */
        margin-top: 20px; /* Adds some space above the copyright message */
    }

    .usb-device-list {
        margin: 8px 0 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
        max-height: 180px;
        overflow-y: auto;
    }

    .usb-device-list table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    .usb-device-list th {
        background: #f0f0f0;
        padding: 6px 8px;
        text-align: left;
        font-size: 12px;
        color: #555;
        position: sticky;
        top: 0;
    }

    .usb-device-list td {
        padding: 6px 8px;
        border-top: 1px solid #eee;
        font-family: monospace;
        word-break: break-all;
    }

    .usb-device-list tr:hover td {
        background: #e8f0fe;
        cursor: pointer;
    }

    .btn-scan {
        background-color: #17a2b8;
        color: white;
        padding: 7px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .btn-scan:hover { background-color: #117a8b; }

    #usbScanStatus {
        font-size: 13px;
        color: #666;
        margin-bottom: 4px;
    }
</style>

<body>

    <h1>Pylontech Monitor Configuration</h1>

    <form id="mqttConfigForm" method="post" onsubmit="submitForm(); return false;">
        <h2>MQTT Settings</h2>
        <label for="mqttBrokerIP">MQTT Broker IP:</label><br>
        <input type="text" id="mqttBrokerIP" name="mqttBrokerIP" required>
        <div id="ipError" style="color: red;"></div>
        <br>

        <label for="brokerusername">(optional) MQTT-Broker User Name:</label><br>
        <input type="text" id="brokerusername" name="brokerusername"><br>

        <label for="brokerpassword">(optional) MQTT-Broker Password:</label><br>
        <input type="text" id="brokerpassword" name="brokerpassword"><br>

        <label for="publishTopic">Top Level Topic for Publishing:</label><br>
        <input type="text" id="publishTopic" name="publishTopic" required><br>

        <label for="responseTopic">Top Level Topic for Responses (currently not used):</label><br>
        <input type="text" id="responseTopic" name="responseTopic" required><br>

        <label for="locationTopic">Location Topic:</label><br>
        <input type="text" id="locationTopic" name="locationTopic" required><br>

        <label for="deviceTopic">Device Topic:</label><br>
        <input type="text" id="deviceTopic" name="deviceTopic" required><br>

        <h2>Serial / USB Adapter</h2>

        <p style="font-size:13px; color:#555; margin:0 0 10px;">
            Leave both fields empty to use the onboard UART (<code>/dev/ttyAMA0</code>).
            Fill them in to use a USB-Serial adapter identified by its hardware IDs.
        </p>

        <button type="button" class="btn-scan" onclick="scanDevices()">🔍 Scan for USB Serial Adapters</button>
        <div id="usbScanStatus"></div>
        <div id="usbDeviceList" class="usb-device-list" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>Device</th>
                        <th>Serial ID</th>
                        <th>Vendor ID</th>
                    </tr>
                </thead>
                <tbody id="usbDeviceRows"></tbody>
            </table>
        </div>

        <label for="usbSerialID">USB Serial ID:</label><br>
        <input type="text" id="usbSerialID" name="usbSerialID" placeholder="e.g. AB0KOTJ8 (leave empty for ttyAMA0)"><br>

        <label for="usbVendorID">USB Vendor ID:</label><br>
        <input type="text" id="usbVendorID" name="usbVendorID" placeholder="e.g. 0403"><br>

        <input type="submit" value="SUBMIT">
        <button type="button" id="cancelButton" style="background-color: #dc3545; color: white; padding: 10px 20px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">CANCEL</button>
    </form>
    <div id="confirmationMessage"></div>
    <p class="copyright">© by DJ0ABR</p>
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('defaultdata.php')
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        document.getElementById('mqttBrokerIP').value = data.mqttBrokerIP || '';
        document.getElementById('brokerusername').value = data.brokerusername || '';
        document.getElementById('brokerpassword').value = data.brokerpassword || '';
        document.getElementById('publishTopic').value = data.publishTopic || '';
        document.getElementById('responseTopic').value = data.responseTopic || '';
        document.getElementById('locationTopic').value = data.locationTopic || '';
        document.getElementById('deviceTopic').value = data.deviceTopic || '';
        document.getElementById('usbSerialID').value = data.usbSerialID || '';
        document.getElementById('usbVendorID').value = data.usbVendorID || '';
    })
    .catch(error => {
        console.error('There was a problem with your fetch operation:', error);
    });
});

function submitForm() {
    var formData = new FormData(document.getElementById('mqttConfigForm'));
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'savedata.php', true);

    xhr.onload = function () {
        if (xhr.status === 200) {
            // Update the page to show confirmation message
            var confirmationDiv = document.getElementById('confirmationMessage');
            confirmationDiv.innerHTML = 'Data submitted successfully! Redirecting...';
            confirmationDiv.style.display = 'block';
            document.getElementById('mqttConfigForm').style.display = 'none';
            
            // Wait for 2 seconds before redirecting
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 3000);
        } else {
            // Update the page to show an error message
            var confirmationDiv = document.getElementById('confirmationMessage');
            confirmationDiv.innerHTML = 'Submission failed. Please try again.';
            confirmationDiv.style.display = 'block';
        }
    };

    xhr.send(formData);
}

// Function to validate IP address
function validateIP(ip) {
    var ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
    return ipRegex.test(ip);
}

// Attaching the event listener to the input field
document.getElementById('mqttBrokerIP').addEventListener('input', function() {
    var ip = this.value;
    if(validateIP(ip)) {
        // If the IP is valid, you might want to hide or remove any error message
        document.getElementById('ipError').textContent = ''; // Clears the error message
    } else {
        // If the IP is invalid, show an error message
        document.getElementById('ipError').textContent = 'Enter a valid IP Address';
    }
});

document.getElementById('cancelButton').addEventListener('click', function() {
    window.location.href = 'index.html';
});

function scanDevices() {
    var status = document.getElementById('usbScanStatus');
    var listDiv = document.getElementById('usbDeviceList');
    var tbody = document.getElementById('usbDeviceRows');

    status.textContent = 'Scanning…';
    listDiv.style.display = 'none';
    tbody.innerHTML = '';

    fetch('scandevices.php')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(devices) {
            if (devices.length === 0) {
                status.textContent = 'No USB serial adapters found.';
                return;
            }
            status.textContent = 'Click a row to use that adapter:';
            devices.forEach(function(d) {
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td>' + escHtml(d.device)   + '</td>' +
                    '<td>' + escHtml(d.serial)   + '</td>' +
                    '<td>' + escHtml(d.idVendor) + '</td>';
                tr.addEventListener('click', function() {
                    document.getElementById('usbSerialID').value = d.serial;
                    document.getElementById('usbVendorID').value = d.idVendor;
                    // Highlight selected row
                    Array.from(tbody.rows).forEach(function(r) { r.style.background = ''; });
                    tr.style.background = '#c8e6c9';
                    status.textContent = 'Selected: ' + d.device;
                });
                tbody.appendChild(tr);
            });
            listDiv.style.display = 'block';
        })
        .catch(function(err) {
            status.textContent = 'Scan failed: ' + err.message;
        });
}

function escHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

</script>

</body>
</html>
